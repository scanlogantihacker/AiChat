<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trợ lý Minecraft &amp; Học tập</title>
<style>
:root{--bg:#f4f1ea;--cd:#fff;--tx:#1d1d1f;--mu:#6b6b70;--bd:#d8d4c8;--ac:#3f9b3a;--acx:#fff;--us:#e6f2e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--cd:#202228;--tx:#f0efe9;--mu:#9a9aa3;--bd:#34363f;--ac:#5cc455;--acx:#10210e;--us:#23361f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15161a;--cd:#202228;--tx:#f0efe9;--mu:#9a9aa3;--bd:#34363f;--ac:#5cc455;--acx:#10210e;--us:#23361f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
header{padding:8px 10px 0}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:9px;border-radius:10px 10px 0 0;border:1px solid var(--bd);border-bottom:0;background:var(--bg);color:var(--mu);font:inherit;font-weight:600}
.tabs button.on{background:var(--cd);color:var(--tx)}
.opts{display:flex;gap:6px;padding:8px 10px;background:var(--cd);border:1px solid var(--bd);border-top:0}
select{flex:1;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px}
#chat{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.m{max-width:92%;padding:9px 12px;border-radius:14px;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--us);white-space:pre-wrap}
.m.a{align-self:flex-start;background:var(--cd);border:1px solid var(--bd)}
.m pre{overflow-x:auto;background:var(--bg);padding:8px;border-radius:8px;margin:6px 0;font-size:13px}
.m code{background:var(--bg);padding:1px 4px;border-radius:4px;font-size:13px}
.sg{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.sg button{font:inherit;font-size:13px;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:6px 10px;text-align:left}
.mu{color:var(--mu);font-size:12px}
.bar{padding:8px 10px;border-top:1px solid var(--bd);background:var(--cd)}
.in{display:flex;gap:6px;align-items:flex-end}
textarea{flex:1;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:9px;resize:none;max-height:120px}
.btn{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:9px 12px}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.btn:disabled{opacity:.45}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.link{background:none;border:0;color:var(--mu);font:inherit;font-size:12px;text-decoration:underline;padding:0}
</style>
</head>
<body>
<div id="app">
 <header>
  <div class="tabs"><button id="t-mc">⛏️ Minecraft</button><button id="t-st">📚 Học tập 8–12</button></div>
 </header>
 <div class="opts" id="opts" hidden>
  <select id="grade"><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select>
  <select id="subj"><option>Toán</option><option>Vật lý</option><option>Hóa học</option><option>Sinh học</option><option>Ngữ văn</option><option>Tiếng Anh</option><option>Lịch sử</option><option>Địa lý</option><option>Tin học</option><option>GDCD / KT&amp;PL</option><option>Tất cả môn</option></select>
 </div>
 <div id="chat"></div>
 <div class="bar">
  <div class="mu" id="imgnote" hidden></div>
  <div class="in">
   <button class="btn" id="cam" hidden aria-label="Gửi ảnh">📷</button>
   <input type="file" id="file" accept="image/*" hidden>
   <textarea id="q" rows="1" placeholder="Hỏi bất cứ điều gì…"></textarea>
   <button class="btn p" id="go">Gửi</button>
  </div>
  <div class="row"><span class="mu">AI có thể sai. Hãy kiểm tra lại với SGK, thầy cô hoặc thử trong game.</span><button class="link" id="clr">Xóa chat</button></div>
 </div>
</div>
<script>
const $=i=>document.getElementById(i);
const SUG={mc:['Cách làm farm sắt Java 1.21','Lệnh give kiếm kim cương Sharpness 5','Cách tìm kim cương nhanh nhất','Làm cửa tự động bằng redstone'],
 st:['Giải phương trình x^2 - 5x + 6 = 0','Giải thích định luật Ôm','Cách phân tích một đoạn thơ','Cân bằng phương trình hóa học'],};
let mode='mc',H={mc:[],st:[]},busy=false,ctl=null,sample=null,img=null;
let pref={mode:'mc',grade:'8',subj:'Toán'};
try{Object.assign(pref,JSON.parse(localStorage.getItem('mcstudy1'))||{})}catch(e){}
function savePref(){try{localStorage.setItem('mcstudy1',JSON.stringify(pref))}catch(e){}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(t){return t.split('```').map((p,i)=>i%2?'<pre>'+esc(p.replace(/^[a-z]*\n/i,''))+'</pre>':esc(p).replace(/^#{1,4} (.*)$/gm,'<b>$1</b>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/^[-*] /gm,'• ').replace(/\n/g,'<br>')).join('')}
function sys(){
 if(mode==='mc')return 'Bạn là chuyên gia Minecraft. Trả lời bằng tiếng Việt, ngắn gọn, dễ đọc trên điện thoại. Khi lệnh hoặc cơ chế khác nhau giữa Java và Bedrock thì nêu rõ cả hai. Nếu câu hỏi phụ thuộc phiên bản mà người dùng chưa nói, hãy trả lời cho Java 1.21 và nói rõ giả định đó. Với lệnh, công thức, số liệu: chỉ đưa ra điều bạn chắc chắn; nếu không chắc phải nói thẳng và khuyên thử trong chế độ sáng tạo, không bịa tên lệnh, block hay tính năng. Bạn không truy cập được internet nên có thể chưa biết bản cập nhật rất mới. Với mod, plugin, server: nêu rõ loader (Fabric, Forge, Paper...) và phiên bản. Không giúp làm hack gây hại server của người khác hay phần mềm độc hại.';
 return 'Bạn là gia sư cho học sinh lớp '+pref.grade+', môn '+pref.subj+', theo chương trình giáo dục phổ thông của Việt Nam (chương trình 2018; nếu học sinh dùng sách cũ thì lưu ý có thể khác). Trả lời bằng tiếng Việt, dễ hiểu, từng bước. Với bài tập: giải thích cách nghĩ và các bước, nói rõ vì sao, rồi đưa đáp án; nếu học sinh gửi bài làm thì kiểm tra và chỉ ra chỗ sai cụ thể. Viết công thức bằng chữ dễ đọc trên điện thoại (ví dụ x^2, căn(x), a/b), không dùng LaTeX. Kiểm tra lại phép tính trước khi trả lời. Nếu đề thiếu dữ kiện thì hỏi lại một câu thay vì đoán. Môn Ngữ văn: gợi ý dàn ý, phân tích, nhận xét bài viết, đưa đoạn mẫu ngắn chứ không viết thay cả bài để nộp. Nếu không chắc hoặc kiến thức có thể khác sách giáo khoa, hãy nói rõ và khuyên đối chiếu SGK hoặc hỏi thầy cô.'}
function add(role,html,raw){const d=document.createElement('div');d.className='m '+(role==='user'?'u':'a');if(raw)d.textContent=html;else d.innerHTML=html;$('chat').appendChild(d);$('chat').scrollTop=1e9;return d}
function show(){const c=$('chat');c.innerHTML='';
 add('assistant',mode==='mc'?'Xin chào! Mình trả lời các câu hỏi về Minecraft: crafting, redstone, lệnh, farm, mod, server…':'Xin chào! Chọn lớp và môn ở trên, rồi gửi bài hoặc câu hỏi. Bạn có thể chụp ảnh đề nếu thấy nút 📷.');
 if(!H[mode].length){const s=document.createElement('div');s.className='sg';SUG[mode].forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{$('q').value=t;send()};s.appendChild(b)});c.appendChild(s)}
 H[mode].forEach(m=>add(m.role,m.role==='user'?m.content:md(m.content),m.role==='user'))}
function setMode(m){mode=m;pref.mode=m;savePref();$('t-mc').className=m==='mc'?'on':'';$('t-st').className=m==='st'?'on':'';$('opts').hidden=m!=='st';show()}
$('t-mc').onclick=()=>setMode('mc');$('t-st').onclick=()=>setMode('st');
$('grade').value=pref.grade;$('subj').value=pref.subj;
$('grade').onchange=e=>{pref.grade=e.target.value;savePref()};$('subj').onchange=e=>{pref.subj=e.target.value;savePref()};
$('clr').onclick=()=>{if(ctl)ctl.abort();H[mode]=[];img=null;$('imgnote').hidden=true;show()};
$('cam').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const bm=await createImageBitmap(f),k=Math.min(1,1280/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
  img=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));$('imgnote').textContent='📷 Đã đính kèm 1 ảnh (gửi kèm câu hỏi tiếp theo)';$('imgnote').hidden=false}catch(x){img=null;$('imgnote').textContent='Không đọc được ảnh này.';$('imgnote').hidden=false}};
const ERR={not_granted:'Bạn cần cho phép Claude trong hộp thoại xin quyền thì trợ lý mới trả lời được.',rate_limited:'Đang quá nhiều yêu cầu, đợi một chút rồi thử lại.'};
async function send(){
 if(busy){if(ctl)ctl.abort();return}
 const t=$('q').value.trim();if(!t||!sample)return;
 const h=H[mode];h.push({role:'user',content:t+(img?' [kèm ảnh]':'')});$('q').value='';$('q').style.height='auto';
 show();busy=true;$('go').textContent='Dừng';
 let m=h.slice(-10);while(m.length&&m[0].role!=='user')m.shift();
 const input=m.map((x,i)=>i===0?{role:'user',content:sys()+'\n\n---\nCâu hỏi của người dùng:\n'+x.content}:x);
 const bub=add('assistant','Đang nghĩ…');ctl=new AbortController();const pic=img;img=null;$('imgnote').hidden=true;
 const opts={onText:({text})=>{bub.innerHTML=md(text);$('chat').scrollTop=1e9},signal:ctl.signal,cache:false,modelTier:'default'};
 if(pic)opts.images=[pic];
 try{const r=await sample(input,opts);h.push({role:'assistant',content:r.text});bub.innerHTML=md(r.text)}
 catch(e){const part=e&&e.text;if(part){h.push({role:'assistant',content:part});bub.innerHTML=md(part)}else{h.pop();bub.textContent=ERR[e&&e.code]||'Có lỗi xảy ra hoặc bạn đã dừng. Thử lại nhé.'}}
 finally{busy=false;ctl=null;$('go').textContent='Gửi'}}
$('go').onclick=send;
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Android|iPhone|iPad/i.test(navigator.userAgent)){e.preventDefault();send()}});
$('q').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px'});
setMode(pref.mode==='st'?'st':'mc');
$('go').disabled=true;
(async()=>{try{sample=await claude.use('sample')}catch(e){sample=null}
 if(!sample){add('assistant','Trợ lý chỉ hoạt động khi mở trang này bên trong Claude. Mở lại từ liên kết artifact trong ứng dụng Claude.');return}
 $('go').disabled=false;
 try{const l=await sample.limits();if(l&&l.images)$('cam').hidden=false}catch(e){}})();
</script>
</body>
</html>
